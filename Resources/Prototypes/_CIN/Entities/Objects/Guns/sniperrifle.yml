- type: entity
  name: No.2 Loughcaster
  parent: [BaseWeaponSniper, BaseGunWieldable, BaseMajorContraband]
  id: WeaponSniperLoughcaster
  description: Стандартная винтовка Варденов. Это оружие с продольно-скользящим поворотным затвором такое же мощное как и столетие назад, используемое на поле боя.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Snipers/bolt_gun_wood.rsi
      layers:
      - state: base
      - state: base1
        map: [ "enum.SolutionContainerLayers.Fill" ]
        visible: false
    - type: Appearance
    - type: Gun
      soundGunshot:
        path: /Audio/_CIN/SFX/gunshot.ogg
    - type: SolutionContainerVisuals
      maxFillLevels: 1
      fillBaseName: base
      inHandsFillBaseName: -fill-
      inHandsMaxFillLevels: 1
      equippedFillBaseName: -fill-
      equippedMaxFillLevels: 1
    - type: MeleeWeapon
      wideAnimationRotation: -135
      damage:
        types:
          Piercing: 12
      angle: 0
      animation: WeaponArcThrust
      soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    - type: MeleeRequiresWield
    - type: AltFireMelee
      attackType: Heavy
    - type: SolutionContainerManager
      solutions:
        melee:
          maxVol: 2
    - type: BallisticAmmoProvider
      whitelist:
        tags:
        - CartridgeAntiMateriel
      capacity: 5
      proto: CartridgeAntiMateriel
      soundInsert:
        path: /Audio/_CIN/SFX/gunload.ogg
        params:
          variation: 0.05
    - type: MeleeChemicalInjector
      solution: melee
    - type: RefillableSolution
      solution: melee
    - type: InjectableSolution
      solution: melee
    - type: SolutionTransfer
      maxTransferAmount: 2
    - type: Sharp
      butcherDelayModifier: 2 #It's a bayonet
    - type: GunRequiresWield
    - type: StaticPrice
      price: 500
